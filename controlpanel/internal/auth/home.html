<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VPN Control</title>
<style>
* {box-sizing:border-box}
body {margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:#edf1ef;color:#18372c;font:16px/1.5 Inter,system-ui,sans-serif}
main {width:min(100%,25rem);padding:clamp(24px,6vw,40px);background:#fff;border:1px solid #c6d4cb;border-radius:14px}
header {font-weight:650;color:#336348}
h1 {margin:1.2rem 0;font-size:1.75rem;line-height:1.2}
label {display:block;margin-top:1rem}
input,button {width:100%;padding:.75rem;font:inherit;border-radius:6px}
input {margin-top:.3rem;border:1px solid #788b80}
button {margin-top:1.5rem;background:#23583f;color:white;border:0;font-weight:650;cursor:pointer}
:focus-visible {outline:3px solid #2084b1;outline-offset:2px}
[role=alert] {color:#912e26}
</style>
</head>
<body><main>
<header>VPN Control</header>
{{if .CSRF}}
<h1>Owner session</h1>
{{with .Profiles}}
<h2>SFA profiles</h2>
<ul>{{range .}}<li><a href="/api/v1/users/{{.ID}}/profiles/download?client=sfa-1.14.4">Download profile for {{.Login}}</a></li>{{end}}</ul>
{{end}}
<form action="/logout" method="post">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<button type="submit">Sign out</button>
</form>
{{else}}
<h1>Owner sign in</h1>
{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}
<form action="/login" method="post">
<label>Username<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button type="submit">Sign in</button>
</form>
{{end}}
</main></body></html>
